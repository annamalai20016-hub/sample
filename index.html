<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050507"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>Woshly · Wash Studio OS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Bricolage+Grotesque:wght@400;600&display=swap">
<style>
:root{--n:#c6ff00;--c:#00f0ff;--m:#ff2bd6;--bg:#050507;--s:#0d0e12;--t:#eef2f5;--d:#7d8590;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 'Bricolage Grotesque',system-ui,sans-serif;min-height:100vh;background-image:radial-gradient(circle at 15% 0,#c6ff0014,transparent 40%),radial-gradient(circle at 90% 100%,#00f0ff14,transparent 40%)}
h1,h2,h3,.dsp{font-family:Unbounded,Impact,sans-serif;letter-spacing:-.02em;margin:0}
button,input,select{font:inherit;color:inherit}
.chm{--k:16px;clip-path:polygon(0 0,calc(100% - var(--k)) 0,100% var(--k),100% 100%,var(--k) 100%,0 calc(100% - var(--k)));border:1px solid transparent;background:linear-gradient(var(--s),var(--s)) padding-box,linear-gradient(135deg,var(--n),#ffffff10 55%,var(--c)) border-box}
.btn{cursor:pointer;border:0;background:var(--n);color:#000;font-weight:600;padding:12px 20px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:.2s;font-family:Unbounded,sans-serif;font-size:12px;letter-spacing:.02em}
.btn:hover{filter:drop-shadow(0 0 10px var(--n));transform:translateY(-2px)}.btn.g{background:#1b1d24;color:var(--t)}.btn.r{background:var(--m);color:#000}.btn.s{padding:8px 14px;font-size:11px}
input,select{width:100%;background:#050507;border:1px solid #262a33;padding:11px 12px;border-radius:2px;outline:0;margin:4px 0 10px}
input:focus,select:focus{border-color:var(--n);box-shadow:0 0 0 3px #c6ff0022}
label{font-size:11px;color:var(--d);text-transform:uppercase;letter-spacing:.1em}
#root.gate{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
#root.in #scene{display:none}
#scene{position:sticky;top:0;height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;perspective:900px}
.stage{transform-style:preserve-3d;animation:sway 8s ease-in-out infinite;width:min(520px,90%)}
@keyframes sway{0%,100%{transform:rotateX(10deg) rotateY(-22deg)}50%{transform:rotateX(6deg) rotateY(22deg)}}
.stage svg{width:100%;overflow:visible;animation:glow 10s linear infinite}
@keyframes glow{0%,72%{filter:drop-shadow(0 0 0 #0000)}85%,100%{filter:drop-shadow(0 0 22px var(--n))}}
.floor{position:absolute;bottom:18%;width:70%;height:90px;background:radial-gradient(ellipse,#c6ff0055,transparent 65%);transform:rotateX(70deg);animation:pulse 3s infinite}
@keyframes pulse{50%{opacity:.4}}
#stg{font:800 12px Unbounded;letter-spacing:.3em;color:var(--c);margin-top:40px;text-shadow:0 0 12px var(--c)}
.body{animation:bc 10s linear infinite}@keyframes bc{0%,25%{fill:#5c4b3b}60%{fill:#2b2a2a}80%,100%{fill:#0b0e12}}
.dirt{animation:dr 10s linear infinite}@keyframes dr{0%,22%{opacity:1}58%{opacity:.08}66%,100%{opacity:0}}
.foam{animation:fm 10s linear infinite}@keyframes fm{0%,16%{opacity:0}30%,50%{opacity:1}66%,100%{opacity:0}}
.foam circle{fill:#fff;stroke:var(--c);animation:bb 2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes bb{to{transform:scale(1.25) translateY(-4px)}}
.spray{animation:sp 10s linear infinite;stroke:var(--c);stroke-width:2;stroke-dasharray:6 14}@keyframes sp{0%,50%{opacity:0}56%,68%{opacity:.9;stroke-dashoffset:-60}72%,100%{opacity:0}}
.spray line{animation:fall .5s linear infinite}@keyframes fall{to{stroke-dashoffset:-40}}
.shine{animation:sh 10s linear infinite;transform-box:fill-box}@keyframes sh{0%,72%{transform:translateX(-120px)}90%,100%{transform:translateX(480px)}}
#ui{padding:clamp(18px,4vw,48px);display:flex;flex-direction:column;justify-content:center;min-height:100vh}
#root.in #ui{justify-content:flex-start;padding-bottom:120px;max-width:1100px;margin:0 auto}
.logo{font:800 14px Unbounded;color:var(--n);text-shadow:0 0 14px var(--n);letter-spacing:.1em}
h1{font-size:clamp(30px,5vw,54px);line-height:1;margin:14px 0}h1 em{font-style:normal;color:var(--n);text-shadow:0 0 22px #c6ff0088}
.sub{color:var(--d);max-width:460px;margin-bottom:24px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{padding:18px;position:relative;overflow:hidden;cursor:pointer;transition:.2s}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.97)}}
.card:hover{box-shadow:0 0 0 1px var(--n)}.card.on{outline:2px solid var(--n);outline-offset:-2px;background:linear-gradient(#142200,#0d0e12) padding-box,linear-gradient(135deg,var(--n),var(--c)) border-box}
.card h3{font-size:15px;margin-bottom:6px;position:relative}.card p{color:var(--d);font-size:13px;margin:0 0 10px;position:relative}.pr{font:800 20px Unbounded;color:var(--n);position:relative}
.fx{position:absolute;inset:0;pointer-events:none}.fx i{position:absolute;bottom:-14px;width:12px;height:12px;border-radius:50%;border:1px solid var(--c);opacity:0}
.card:hover .fx i,.card.on .fx i{animation:rise 2.4s infinite}
@keyframes rise{20%{opacity:.9}100%{transform:translateY(-190px) scale(1.5);opacity:0}}
.fx.w i{width:3px;height:14px;border-radius:2px;border:0;background:var(--c);top:-16px;bottom:auto}.card:hover .fx.w i,.card.on .fx.w i{animation:drop 1s linear infinite}@keyframes drop{from{transform:translateY(0);opacity:1}to{transform:translateY(190px);opacity:0}}
.fx.i i{border:0;background:radial-gradient(var(--n),transparent 70%);width:16px;height:16px;top:20%;bottom:auto}.card:hover .fx.i i,.card.on .fx.i i{animation:tw 1.6s infinite}@keyframes tw{50%{transform:scale(2);opacity:1}}
.dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:4px;padding:8px;background:#0d0e12ee;backdrop-filter:blur(12px);border:1px solid #2a2f3a;border-radius:999px 18px 999px 18px;z-index:5;max-width:96vw;overflow-x:auto}
.dock button{background:0;border:0;padding:10px 14px;border-radius:999px;cursor:pointer;color:var(--d);font:600 11px Unbounded;white-space:nowrap;transition:.25s}
.dock button.on{background:var(--n);color:#000;box-shadow:0 0 18px #c6ff0066}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.chip{font:600 10px Unbounded;padding:5px 10px;border-radius:99px;border:1px solid}.chip.p{color:var(--m);border-color:var(--m)}.chip.d{color:var(--n);border-color:var(--n)}
.stat{padding:18px}.stat b{display:block;font:800 26px Unbounded;color:var(--n)}.stat span{color:var(--d);font-size:12px}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px;padding:10px 4px}.bars div{flex:1;background:linear-gradient(var(--n),var(--c));min-height:3px;animation:gr .8s both;transform-origin:bottom;position:relative}
@keyframes gr{from{transform:scaleY(0)}}.bars small{position:absolute;bottom:-20px;left:0;right:0;text-align:center;color:var(--d);font-size:10px}
.row{display:flex;gap:12px;align-items:center;padding:14px 16px;margin-bottom:10px;flex-wrap:wrap;animation:up .4s both}.row>.g1{flex:1;min-width:160px}
.steps{display:flex;gap:6px;margin-bottom:20px}.steps i{flex:1;height:4px;background:#222;transition:.4s}.steps i.on{background:var(--n);box-shadow:0 0 10px var(--n)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{display:flex;gap:8px;margin:10px 0}.pill{cursor:pointer;padding:8px 14px;border:1px solid #2a2f3a;border-radius:99px;font-size:12px;background:0}.pill.on{border-color:var(--n);color:var(--n)}
#modal{position:fixed;inset:0;background:#000d;z-index:20;display:none;overflow:auto;padding:20px}#modal.o{display:block}
.inv{background:#fff;color:#111;max-width:680px;margin:0 auto;padding:30px;font:13px/1.5 system-ui,sans-serif}.inv h2{font-family:inherit;font-size:20px}.inv table{width:100%;border-collapse:collapse;margin:14px 0}.inv th,.inv td{padding:7px;border-bottom:1px solid #ddd;text-align:left}.inv .r{text-align:right}.inv hr{border:0;border-top:2px dashed #999}
@media(max-width:800px){#root.gate{grid-template-columns:1fr}#scene{position:relative;height:42vh}#ui{min-height:0}.two{grid-template-columns:1fr}}
@media print{body{background:#fff}#root,.btnbar{display:none!important}#modal{position:static;background:#fff;padding:0;display:block}}
#c3d{position:absolute;inset:0;width:100%;height:100%}#stg{position:absolute;bottom:9%;margin:0;z-index:2}.ph{height:92px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-size:11px;color:var(--d);overflow:hidden;position:relative;padding:4px}.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.ph b{position:absolute;bottom:2px;left:4px;font-size:10px;color:var(--n);text-shadow:0 0 4px #000;z-index:1}.ph input{display:none}.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-width:900px;margin:0 auto}.gal img{width:100%;border:1px solid #333}
#root.reg{display:block}#root.reg #scene{display:none}#root.reg #ui{max-width:760px;margin:0 auto;justify-content:flex-start;padding-bottom:60px}.sec{padding:20px;margin-bottom:14px}.sec h3{font-size:13px;margin-bottom:12px;color:var(--c)}.pf{display:flex;flex-direction:column}.pf label{font-size:10px}.pf input{width:92px;margin:0}
html{-webkit-text-size-adjust:100%}body{overflow-x:hidden}*{-webkit-tap-highlight-color:transparent}input,select{font-size:16px;min-height:44px}.btn{min-height:44px}
@media(max-width:600px){.btn{padding:14px 16px}.dock button{padding:12px 10px;font-size:10px}.grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}.row{padding:12px}.pf input{width:80px}#ui{padding:16px}#scene{height:36vh}}
</style></head><body>
<div id="root" class="gate">
<div id="scene"><canvas id="c3d"></canvas><div id="stg">DIRTY</div></div>
<div id="ui"></div></div><div id="modal"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),K='woshly_v1',M=n=>'₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2}),r2=n=>Math.round(n*100)/100;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8),dk=t=>new Date(t).toLocaleDateString('en-CA');
let DB=null;try{DB=JSON.parse(localStorage.getItem(K))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){}};
const defSv=()=>[{id:'s1',t:'car',n:'Foam Wash',d:'Snow-foam pre-soak, hand finish',p:{hatchback:399,sedan:499,suv:649},fx:''},{id:'s2',t:'car',n:'Normal Wash',d:'Pressure rinse, shampoo, dry',p:{hatchback:299,sedan:349,suv:449},fx:'w'},{id:'s3',t:'car',n:'Interior Cleaning',d:'Vacuum, dash, seats, mats',p:{hatchback:599,sedan:749,suv:949},fx:'i'},{id:'s4',t:'bike',n:'Foam Wash',d:'Foam soak + detail rinse',p:{std:199},fx:''},{id:'s5',t:'bike',n:'Normal Wash',d:'Rinse, shampoo, dry',p:{std:129},fx:'w'}];
const defAd=()=>[{id:'a1',t:'car',n:'Tyre Polish',p:99},{id:'a2',t:'car',n:'AC Vent Cleaning',p:249},{id:'a3',t:'car',n:'Engine Bay Cleaning',p:399},{id:'a4',t:'car',n:'Wax Polish',p:349},{id:'a5',t:'bike',n:'Chain Clean & Lube',p:79},{id:'a6',t:'bike',n:'Tyre Polish',p:49}];
function seed(){const o={id:'demo',name:'Woshly Demo Studio',gst:'33ABCDE1234F1Z5',addr:'12 Marina Road',city:'Chennai',phone:'9876543210',email:'hello@woshly.in',wa:'9876543210',waOn:true,seq:0,users:[{u:'admin',p:'admin123',role:'admin'},{u:'staff',p:'staff123',role:'employee'}],sv:defSv(),ad:defAd(),orders:[]};
for(let i=0;i<16;i++){const sv=o.sv[i%3],sz=['hatchback','sedan','suv'][i%3],ts=Date.now()-Math.floor(i/2)*864e5-i*36e5;o.orders.push(mk(o,{t:'car',size:sz,sv,ad:[o.ad[i%3]],c:{name:['Arjun','Meera','Karthik','Divya','Ravi'][i%5],phone:'98xxxxxx'+i,vname:['Swift','City','Creta','i20','Nexon'][i%5],vno:'TN 09 AB '+(1000+i*37)},pay:['cash','card','gpay'][i%3]},ts,i>2?'delivered':'pending'))}return o}
function calc(o,w){const k=w.t==='bike'?'std':w.size,items=[{n:w.sv.n+(w.t==='car'?' ('+w.size+')':' (bike)'),p:w.sv.p[k]},...w.ad.map(a=>({n:a.n,p:a.p}))],sub=r2(items.reduce((a,b)=>a+b.p,0)),cg=r2(sub*.09);return{items,sub,cg,sg:cg,total:r2(sub+cg*2)}}
function mk(o,w,ts,st){const c=calc(o,w);return{id:uid(),no:'INV-'+new Date(ts).getFullYear()+'-'+String(++o.seq).padStart(4,'0'),ts,t:w.t,c:w.c,...c,pay:w.pay,status:st||'pending'}}
if(!DB||!DB.orgs){DB={orgs:[seed()]};save()}
let S={view:'pick',org:null,user:null,tab:'new',w:{step:1,ad:[],c:{}},flt:'all',day:dk(Date.now())};
const O=()=>DB.orgs.find(o=>o.id===S.org),adm=()=>S.user&&S.user.role==='admin';
function R(){$('#root').className=S.user?'in':S.view==='reg'?'reg':'gate';$('#ui').innerHTML=S.user?shell():gate()}
function gate(){const logo='<div class="logo">◉ WOSHLY</div>';
if(S.view==='pick')return`${logo}<h1>Your wash studio.<br><em>One neon dashboard.</em></h1><p class="sub">Choose your organisation to sign in, or register a new studio with GST-ready billing.</p><div class="grid">${DB.orgs.map((o,i)=>`<div class="card chm" style="animation-delay:${i*.08}s" onclick="S.org='${o.id}';S.view='login';R()"><h3>${esc(o.name)}</h3><p>${esc(o.city)} · GST ${esc(o.gst)}</p><span class="chip d">SIGN IN →</span></div>`).join('')}<div class="card chm" onclick="S.view='reg';R()"><h3 style="color:var(--n)">+ Register studio</h3><p>New organisation with admin &amp; staff logins</p></div></div>`;
if(S.view==='login'){const o=O();return`${logo}<h1>${esc(o.name)}</h1><p class="sub">${esc(o.addr)}, ${esc(o.city)}</p><div class="chm" style="padding:22px;max-width:380px"><label>Username</label><input id="lu" autocomplete="username"><label>Password</label><input id="lp" type="password" autocomplete="current-password" onkeydown="event.key==='Enter'&&login()"><p id="le" style="color:var(--m);margin:0 0 8px"></p><button class="btn" onclick="login()">ENTER STUDIO</button> <button class="btn g" onclick="S.view='pick';R()">BACK</button>${o.id==='demo'?'<p class="sub" style="margin:14px 0 0;font-size:12px">Demo → admin / admin123 · staff / staff123</p>':''}</div>`}
const rows=(t,list)=>list.map(s=>`<tr><td>${s.n}</td>${(t==='car'?['hatchback','sedan','suv']:['std']).map(k=>`<td><input data-p="${s.id}|${k}" type="number" value="${s.p[k]}" style="margin:2px;width:84px"></td>`).join('')}</tr>`).join('');
return`<div class="top"><div class="logo">◉ WOSHLY</div><button class="btn g s" onclick="S.view='pick';R()">← BACK</button></div><h1 style="font-size:clamp(26px,6vw,40px)">Register your <em>studio</em></h1><p class="sub">Two minutes. Prices, logins and WhatsApp settings can be changed later.</p>
<div class="chm sec"><h3>1 · Studio details</h3><div class="two"><div><label>Studio name</label><input id="r_n"></div><div><label>GSTIN</label><input id="r_g" placeholder="33ABCDE1234F1Z5"></div><div><label>Address</label><input id="r_a"></div><div><label>City</label><input id="r_c"></div><div><label>Contact number</label><input id="r_p" type="tel"></div><div><label>Email</label><input id="r_e" type="email"></div></div></div>
<div class="chm sec"><h3>2 · Logins</h3><div class="two"><div><label>Admin username</label><input id="r_au"></div><div><label>Admin password</label><input id="r_ap" type="password"></div><div><label>Employee username</label><input id="r_eu"></div><div><label>Employee password</label><input id="r_ep" type="password"></div></div></div>
<div class="chm sec"><h3>3 · WhatsApp billing</h3><label>WhatsApp Business number</label><input id="r_w" type="tel" placeholder="98765 43210"><label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0"><input id="r_wa" type="checkbox" checked style="width:auto;margin:0;min-height:0"> Send the bill to customers on WhatsApp automatically after billing</label></div>
<div class="chm sec"><h3>4 · Service prices (₹, excl. GST)</h3><div style="overflow-x:auto"><table style="width:100%;font-size:13px;min-width:330px"><tr><td>Car service</td><td>Hatchback</td><td>Sedan</td><td>SUV</td></tr>${rows('car',defSv().filter(s=>s.t==='car'))}</table><table style="font-size:13px;margin-top:10px"><tr><td>Bike service</td><td>Price</td></tr>${rows('bike',defSv().filter(s=>s.t==='bike'))}</table></div></div>
<p id="le" style="color:var(--m)"></p><button class="btn" onclick="reg()">CREATE STUDIO</button>`}
function login(){const o=O(),u=$('#lu').value.trim(),p=$('#lp').value,x=o.users.find(a=>a.u===u&&a.p===p);if(!x){$('#le').textContent='Wrong username or password';return}S.user=x;S.tab=x.role==='admin'?'dash':'new';S.w={step:1,ad:[],c:{}};R()}
function reg(){const v=i=>$('#r_'+i).value.trim(),sv=defSv(),ad=defAd();document.querySelectorAll('[data-p]').forEach(i=>{const[a,k]=i.dataset.p.split('|'),s=sv.find(z=>z.id===a);if(s)s.p[k]=+i.value||0});
if(!v('n')||!v('g')||!v('au')||!v('ap')||!v('eu')||!v('ep')){$('#le').textContent='Name, GSTIN and both logins are required';return}
if(!/^\d{2}[A-Z]{5}\d{4}[A-Z][A-Z\d]Z[A-Z\d]$/i.test(v('g'))){$('#le').textContent='GSTIN format looks invalid (15 characters)';return}
if($('#r_wa').checked&&v('w').replace(/\D/g,'').length<10){$('#le').textContent='Enter a valid 10-digit WhatsApp Business number or untick the option';return}
const o={id:uid(),name:v('n'),gst:v('g').toUpperCase(),addr:v('a'),city:v('c'),phone:v('p'),email:v('e'),wa:v('w'),waOn:$('#r_wa').checked,seq:0,users:[{u:v('au'),p:v('ap'),role:'admin'},{u:v('eu'),p:v('ep'),role:'employee'}],sv,ad,orders:[]};DB.orgs.push(o);save();S.org=o.id;S.user=o.users[0];S.tab='dash';R()}
function shell(){const o=O(),tabs=adm()?[['dash','Dashboard'],['new','New order'],['orders','Orders'],['svc','Services'],['team','Team']]:[['new','New order'],['orders','Orders']];
return`<div class="top"><div><div class="logo">◉ ${esc(o.name)}</div><small style="color:var(--d)">${esc(S.user.u)} · ${S.user.role}</small></div><button class="btn g s" onclick="S.user=null;S.view='pick';R()">LOG OUT</button></div>${{dash,new:neu,orders,svc,team}[S.tab]()}<div class="dock">${tabs.map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="S.tab='${t[0]}';R()">${t[1].toUpperCase()}</button>`).join('')}</div>`}
const fx=c=>'';
function neu(){const o=O(),w=S.w,k=w.t==='bike'?'std':w.size,st=w.step;w.ph=w.ph||[];let h=`<h2 style="margin-bottom:14px">New order</h2><div class="steps">${[1,2,3,4,5,6,7].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div>`;
const bkb='<div style="margin-top:18px"><button class="btn g" onclick="bk()">BACK</button></div>',nx=(ok,l='NEXT')=>`<div style="margin-top:18px"><button class="btn g" ${st>1?`onclick="bk()"`:'disabled'}>BACK</button> <button class="btn" ${ok?`onclick="S.w.step++;R()"`:'disabled style="opacity:.3"'}>${l}</button></div>`;
